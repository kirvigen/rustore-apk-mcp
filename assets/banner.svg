<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F14"/>
      <stop offset="1" stop-color="#111820"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1" fill="#FFFFFF" opacity="0.035"/>
    </pattern>
    <style>
      text { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <g transform="translate(0,-26)">
  <rect x="80" y="184" width="134" height="32" rx="12" fill="#132A26" stroke="#22483B"/>
  <text class="mono" x="147" y="205" text-anchor="middle" font-size="13" letter-spacing="1.5" fill="#39D98A">MCP SERVER</text>
  <text x="80" y="296" font-size="74" font-weight="800" letter-spacing="-2" fill="#F2F6FA">rustore-apk-mcp</text>
  <path d="M80 324H136" stroke="#22C1A6" stroke-width="2"/>
  <text x="80" y="369" font-size="25" fill="#8899AA">Verified Android APKs for your AI agent.</text>
  <text x="80" y="407" font-size="25" fill="#8899AA">By package name alone.</text>
  <text class="mono" x="80" y="459" font-size="15" fill="#8899AA">no browser  ·  no account  ·  no API key</text>

  <rect x="832" y="144" width="368" height="94" rx="16" fill="#131C25" stroke="#223040" stroke-width="1"/>
  <text class="mono" x="860" y="176" font-size="13" fill="#8899AA">package name</text>
  <text class="mono" x="860" y="211" font-size="23" fill="#F2F6FA">com.example.app</text>

  <path d="M1016 248V274" fill="none" stroke="#22C1A6" stroke-width="1.5"/>
  <path d="M1011 269L1016 276L1021 269Z" fill="#39D98A"/>

  <rect x="832" y="286" width="368" height="94" rx="16" fill="#131C25" stroke="#223040" stroke-width="1"/>
  <text x="860" y="325" font-size="25" font-weight="600" fill="#F2F6FA">RuStore API</text>
  <text class="mono" x="860" y="354" font-size="15" fill="#8899AA">signature + metadata</text>

  <path d="M1016 390V416" fill="none" stroke="#22C1A6" stroke-width="1.5"/>
  <path d="M1011 411L1016 418L1021 411Z" fill="#39D98A"/>

  <rect x="832" y="428" width="368" height="94" rx="16" fill="#131C25" stroke="#223040" stroke-width="1"/>
  <text class="mono" x="860" y="483" font-size="23" font-weight="600" fill="#F2F6FA">verified .apk</text>
  <circle cx="1150" cy="475" r="21" fill="#39D98A"/>
  <path d="M1141 475L1147 481L1160 468" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M80 560H1200" stroke="#223040" stroke-width="1"/>
  <text class="mono" x="640" y="595" text-anchor="middle" font-size="15" fill="#8899AA">ZIP CRC   ·   manifest   ·   APK signature   ·   certificate pinned to RuStore</text>
