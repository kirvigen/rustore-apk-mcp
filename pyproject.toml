[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apk-scrapper"
version = "0.1.0"
description = "MCP server for verified APK downloads from RuStore by package name"
readme = "README.md"
license = "MIT"
authors = [{ name = "Kirill Konishev" }]
keywords = ["mcp", "model-context-protocol", "android", "apk", "rustore", "agent-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1",
    "mcp>=1.20,<2",
]

[project.scripts]
apk-scrapper = "apk_scrapper.cli:main"
rustore-apk-mcp = "apk_scrapper.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.urls]
Homepage = "https://github.com/kirvigen/rustore-apk-mcp"
Repository = "https://github.com/kirvigen/rustore-apk-mcp"
Issues = "https://github.com/kirvigen/rustore-apk-mcp/issues"
